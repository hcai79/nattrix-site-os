name: Workflow Core

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Offline contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run deterministic tests
        run: npm test
      - name: Lint Portfolio Engine PHP
        run: |
          php --version
          find wordpress/portfolio-engine -type f -name '*.php' -print0 | xargs -0 -n1 php -l
